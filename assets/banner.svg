<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MiniMax Agent Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="0.5" stop-color="#ff5d5d"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7db4ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity="0.35">
    <circle cx="1130" cy="60" r="220" fill="none" stroke="#232c40" stroke-width="2"/>
    <circle cx="1130" cy="60" r="150" fill="none" stroke="#232c40" stroke-width="2"/>
  </g>

  <!-- icon tile -->
  <g transform="translate(80 70)">
    <rect width="180" height="180" rx="42" fill="#10141d" stroke="#2a3348" stroke-width="3"/>
    <g filter="url(#glow)">
      <path d="M44 126 L44 66 Q44 52 58 60 L90 80 L122 60 Q136 52 136 66 L136 126"
            fill="none" stroke="url(#flame)" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(104 100)">
      <path d="M14 0 L0 32 L13 32 L6 58 L32 22 L17 22 Z"
            fill="url(#bolt)" stroke="#0b0d12" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <circle cx="140" cy="46" r="7" fill="#39d98a"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="66" font-weight="800" fill="#f2f5fb" letter-spacing="-1">MiniMax Agent</text>
  <text x="302" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="40" font-weight="600" fill="url(#flame)" letter-spacing="0.5">Automation</text>

  <text x="302" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="21" fill="#8b95a8">signup · daily check-in · token &amp; cookie harvest</text>

  <!-- pills -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
    <rect x="302" y="272" rx="11" width="86" height="30" fill="#1b2030" stroke="#2a3348"/>
    <text x="345" y="292" fill="#9db6e0" text-anchor="middle">python</text>
    <rect x="398" y="272" rx="11" width="118" height="30" fill="#1b2030" stroke="#2a3348"/>
    <text x="457" y="292" fill="#9db6e0" text-anchor="middle">playwright</text>
    <rect x="526" y="272" rx="11" width="96" height="30" fill="#1b2030" stroke="#2a3348"/>
    <text x="574" y="292" fill="#9db6e0" text-anchor="middle">zenvex</text>
  </g>
</svg>
